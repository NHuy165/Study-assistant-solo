services:
  # Test database
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test_study_assistant
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d test_study_assistant']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Pytest runner
  pytest-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    env_file:
      - ./backend/.env.ci
    depends_on:
      db-test:
        condition: service_healthy
