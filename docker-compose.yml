services:
  # Database service
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Q6L0N2H0LQS5016SQL5888
      POSTGRES_DB: group_project_sample
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service
  api:
    build: .
    ports:
      - "8000:8000"
      - "5678:5678" # <-- 1. Expose the debug port to your local machine
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://postgres:Q6L0N2H0LQS5016SQL5888@db:5432/group_project_sample
    depends_on:
      - db
    volumes:
      - ./backend:/code/backend
    # 2. Override the CMD to wrap your app in the debugger
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "fastapi", "dev", "backend/src/main.py", "--port", "8000", "--host", "0.0.0.0"]

volumes:
  postgres_data: