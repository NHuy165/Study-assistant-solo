services:
  # Database
  db:
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=main-password
      - POSTGRES_DB=study_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d study_assistant']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Test database
  db-test:
    image: pgvector/pgvector:pg16
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test_study_assistant
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d test_study_assistant']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend
  backend:
    image: backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/docs'')" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Frontend
  frontend:
    image: frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules # Anonymous volume so host files don't overwrite
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  test_postgres_data:
